<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Grid · Pantalla</title>
<style>
  /* Fondo transparente solo dentro de OBS (Browser Source 1920×1080), encima
     de Vizzie. En cualquier otro navegador sale con fondo oscuro para que se
     lea. ?transparente fuerza transparente; ?preview fuerza el fondo. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.preview {
    background:
      repeating-conic-gradient(#222 0% 25%, #2c2c2c 0% 50%) 0 0 / 40px 40px;
  }
  :root {
    --visual: 29, 185, 84;
    --fx: 255, 210, 0;
    --vote: 225, 29, 29;
    --cell-alpha: 0.28;
  }
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    font-family: system-ui, sans-serif;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
  }

  /* Grilla 3×3 */
  #grid {
    position: absolute;
    left: 120px;
    top: 130px;
    width: 820px;
    height: 820px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .cell {
    --c: 255, 255, 255;
    position: relative;
    border-radius: 18px;
    border: 4px solid rgba(var(--c), 0.9);
    background: rgba(var(--c), var(--cell-alpha));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 96px;
    font-weight: 800;
    transition: background 0.4s, opacity 0.4s, filter 0.4s;
  }
  .cell.col-visual { --c: var(--visual); }
  .cell.col-fx { --c: var(--fx); }
  .cell.col-vote { --c: var(--vote); }
  .cell.flash { animation: flash 0.7s ease-out; }
  @keyframes flash {
    0% { background: rgba(var(--c), 1); transform: scale(1.06); }
    100% { background: rgba(var(--c), var(--cell-alpha)); transform: scale(1); }
  }
  .cell.pending { animation: pulse 0.5s ease-in-out infinite alternate; }
  @keyframes pulse { to { background: rgba(var(--c), 0.7); } }
  .cell.cooling { opacity: 0.35; }
  .cell.locked { opacity: 0.25; filter: grayscale(1); }
  .cell.winner {
    background: rgba(var(--c), 0.85);
    animation: glow 1s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { box-shadow: 0 0 20px 4px rgba(var(--c), 0.6); }
    to { box-shadow: 0 0 60px 16px rgba(var(--c), 0.95); }
  }
  /* Con arte: el dibujo ocupa la celda y el número pasa a una esquina. */
  .cell .ga { opacity: 0.8; border-radius: 14px; }
  .cell .num { position: relative; z-index: 1; }
  #stage.art .cell { background: rgba(0, 0, 0, 0.25); }
  #stage.art .cell .num { position: absolute; top: 12px; left: 18px; font-size: 40px; }
  #stage.art .cell.flash { animation: flash-art 0.7s ease-out; }
  #stage.art .cell.flash .ga { opacity: 1; }
  #stage.art .cell.pending { animation: pulse-art 0.5s ease-in-out infinite alternate; }
  @keyframes flash-art {
    0% { filter: brightness(2.2); transform: scale(1.06); }
    100% { filter: none; transform: scale(1); }
  }
  @keyframes pulse-art { to { filter: brightness(1.7); } }
  .cell .tag {
    position: absolute;
    bottom: 14px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  /* Panel derecho */
  #side {
    position: absolute;
    left: 1060px;
    top: 130px;
    width: 740px;
    height: 820px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  #title { font-size: 44px; font-weight: 800; letter-spacing: 0.3em; margin: 0; }
  #qrBox {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  #qrBox.hidden { display: none; }
  #qr {
    width: 300px;
    height: 300px;
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    box-sizing: border-box;
  }
  #qr svg { width: 100%; height: 100%; display: block; }
  #qrText { font-size: 30px; line-height: 1.3; }
  #qrText .url { font-size: 24px; opacity: 0.85; word-break: break-all; }

  .box {
    background: rgba(0, 0, 0, 0.45);
    border-radius: 16px;
    padding: 20px 26px;
    font-size: 30px;
  }
  #vote { border-left: 10px solid rgb(var(--vote)); }
  #vote .big { font-size: 56px; font-weight: 800; }
  #winner {
    display: none;
    background: rgba(var(--vote), 0.9);
    border-radius: 16px;
    padding: 24px 26px;
    text-align: center;
    animation: glow-box 1s ease-in-out infinite alternate;
  }
  #winner.show { display: block; }
  #winner .label { font-size: 30px; letter-spacing: 0.2em; }
  #winner .cell-n { font-size: 140px; font-weight: 900; line-height: 1; }
  @keyframes glow-box {
    from { box-shadow: 0 0 20px rgba(var(--vote), 0.5); }
    to { box-shadow: 0 0 70px rgba(var(--vote), 1); }
  }
  #status { font-size: 22px; opacity: 0.8; margin-top: auto; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="side">
    <h1 id="title">THE GRID</h1>
    <div id="qrBox">
      <div id="qr"></div>
      <div id="qrText">Escanea y juega<br /><span class="url" id="qrUrl"></span></div>
    </div>
    <div class="box" id="vote"></div>
    <div id="winner"><div class="label">GANÓ</div><div class="cell-n" id="winnerCell"></div></div>
    <div id="status"></div>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="art.js"></script>
<script>
  const COLUMNS = ['visual', 'fx', 'vote'];
  const params = new URLSearchParams(location.search);
  // OBS expone window.obsstudio en sus Browser Sources.
  const inObs = typeof window.obsstudio !== 'undefined';
  if (params.has('preview') || (!inObs && !params.has('transparente'))) {
    document.body.classList.add('preview');
  }
  // ?monitor: vista previa del operador (no cuenta como pantalla de OBS).
  const isMonitor = params.has('monitor');
  // ?tema=naturaleza fuerza un estilo en esta pantalla.
  const forcedTheme = params.get('tema');
  let shownTheme = null;

  // Escala el escenario 1920×1080 a la ventana (en OBS a 1920×1080 queda en 1).
  const stage = document.getElementById('stage');
  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${k})`;
  }
  addEventListener('resize', fit);
  fit();

  const cells = {};
  const gridEl = document.getElementById('grid');
  for (let row = 1; row <= 3; row++) {
    for (const column of COLUMNS) {
      const el = document.createElement('div');
      el.className = `cell col-${column}`;
      const art = document.createElement('div');
      art.className = 'ga';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = row;
      const tag = document.createElement('span');
      tag.className = 'tag';
      el.append(art, num, tag);
      gridEl.appendChild(el);
      cells[`${column}-${row}`] = { el, tag, art, column, cell: row };
    }
  }

  let qrFor = null;
  function renderQr(url) {
    if (url === qrFor) return;
    qrFor = url;
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    document.getElementById('qrUrl').textContent = url.replace(/^https?:\/\//, '');
  }

  function renderTheme(state) {
    const theme = forcedTheme || state.display.theme || 'clasico';
    if (theme === shownTheme) return;
    shownTheme = theme;
    const hasArt = theme !== 'clasico' && window.GridArt?.THEMES.includes(theme);
    stage.classList.toggle('art', Boolean(hasArt));
    for (const { art, column, cell } of Object.values(cells)) {
      art.innerHTML = hasArt ? GridArt.svg(theme, column, cell) : '';
    }
  }

  function render(state) {
    renderTheme(state);
    for (const column of COLUMNS) {
      for (let cell = 1; cell <= 3; cell++) {
        const { el, tag } = cells[`${column}-${cell}`];
        const locked = Boolean(state.locks[column]);
        const cooling = column === 'fx' && state.fx.cooling[cell];
        el.classList.toggle('locked', locked);
        el.classList.toggle('pending', column === 'fx' && !locked && state.fx.pending.includes(cell));
        el.classList.toggle('cooling', Boolean(cooling) && !locked);
        el.classList.toggle('winner', column === 'vote' && state.display.winner?.cell === cell);
        tag.textContent = locked ? 'BLOQUEADA' : '';
      }
    }

    const qrBox = document.getElementById('qrBox');
    qrBox.classList.toggle('hidden', !state.display.qr);
    if (state.display.qr) renderQr(state.display.publicUrl || location.origin);

    const vote = document.getElementById('vote');
    if (state.locks.vote) {
      vote.innerHTML = 'VOTO · <b>en pausa</b>';
    } else if (state.vote.barsLeft == null) {
      vote.innerHTML = 'VOTO · esperando compás';
    } else {
      const left = state.vote.barsLeft;
      vote.innerHTML = `VOTO · cierra en<br /><span class="big">${left}</span> ${left === 1 ? 'compás' : 'compases'}`;
    }

    const winner = document.getElementById('winner');
    winner.classList.toggle('show', Boolean(state.display.winner));
    if (state.display.winner) document.getElementById('winnerCell').textContent = state.display.winner.cell;

    document.getElementById('status').textContent = state.bar ? '' : 'esperando compás de Max';
  }

  function flash(column, cell) {
    const entry = cells[`${column}-${cell}`];
    if (!entry || column === 'vote') return; // el ganador ya tiene su propia animación
    const { el } = entry;
    el.classList.remove('flash');
    void el.offsetWidth; // reinicia la animación si llegan toques seguidos
    el.classList.add('flash');
  }

  // Reconecta solo: la pantalla debe sobrevivir a cortes de red o reinicios
  // del servidor sin tocar OBS.
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({ type: 'hello', role: 'screen', monitor: isMonitor }));
    });
    ws.addEventListener('message', (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'state') render(msg.state);
      if (msg.type === 'fire') flash(msg.column, msg.cell);
    });
    ws.addEventListener('close', () => {
      document.getElementById('status').textContent = 'reconectando con el servidor…';
      setTimeout(connect, 2000);
    });
  }
  connect();
</script>
</body>
</html>
