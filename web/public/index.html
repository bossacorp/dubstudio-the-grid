<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Grid</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: #111;
    font-family: system-ui, sans-serif;
    color: #eee;
  }
  h1 { margin: 0; letter-spacing: 0.2em; font-size: 1.25rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: min(90vw, 360px);
    aspect-ratio: 1;
  }
  button.cell {
    --c: #888;
    position: relative;
    overflow: hidden;
    border: none;
    border-radius: 10px;
    padding: 0;
    font-size: 1.5rem;
    font-weight: bold;
    color: #111;
    background: var(--c);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s, filter 0.12s;
  }
  button.cell.col-visual { --c: #1db954; }
  button.cell.col-fx { --c: #ffd200; }
  button.cell.col-vote { --c: #e11d1d; }
  button.cell .num { position: relative; z-index: 1; }

  /* Con arte: fondo oscuro, borde del color y el número en una esquina. */
  body.art button.cell { background: #000; box-shadow: inset 0 0 0 3px var(--c); }
  body.art button.cell .ga { inset: 3px; border-radius: 7px; }
  body.art button.cell .num {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 0.85rem;
    color: #fff;
    text-shadow: 0 1px 4px #000;
  }

  /* Al tocar: pequeño rebote para que se sienta la respuesta. */
  button.cell.tap { transform: scale(0.9); filter: brightness(1.5); }
  button.cell:disabled { opacity: 0.35; cursor: not-allowed; }
  /* Amarilla pendiente: espera al siguiente compás */
  button.cell.pending { animation: pulse 0.5s ease-in-out infinite alternate; }
  @keyframes pulse { to { filter: brightness(1.6); transform: scale(0.94); } }
  /* Roja: tu voto en esta ventana */
  button.cell.voted { outline: 4px solid #fff; outline-offset: -4px; }
  #status, #vote { font-size: 0.85rem; opacity: 0.6; margin: 0; }
</style>
</head>
<body>
  <h1>THE GRID</h1>
  <div class="grid" id="grid"></div>
  <p id="vote"></p>
  <div id="status">conectando…</div>

<script src="art.js"></script>
<script>
  const COLUMNS = ['visual', 'fx', 'vote'];
  // ?tema=psicodelico fuerza un estilo en este celular (para probar estilos).
  const forcedTheme = new URLSearchParams(location.search).get('tema');
  let state = {
    locks: { visual: false, fx: false, vote: false },
    bar: 0,
    fx: { pending: [], cooling: {} },
    vote: { round: null, barsLeft: null },
    display: { theme: 'clasico' },
  };
  let connected = false;
  let ws = null;
  let shownTheme = null;
  // Tu voto en la ronda actual: { round, cell }.
  let myVote = null;

  function storedDeviceId() {
    try {
      let id = localStorage.getItem('grid-device-id');
      if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2);
        localStorage.setItem('grid-device-id', id);
      }
      return id;
    } catch {
      return String(Math.random()).slice(2);
    }
  }
  const deviceId = storedDeviceId();

  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const voteEl = document.getElementById('vote');
  const buttons = [];

  for (let row = 1; row <= 3; row++) {
    for (const column of COLUMNS) {
      const btn = document.createElement('button');
      btn.className = `cell col-${column}`;
      btn.setAttribute('aria-label', `${column} ${row}`);
      const art = document.createElement('span');
      art.className = 'ga';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = row;
      btn.append(art, num);
      btn.addEventListener('click', () => sendTouch(column, row, btn));
      gridEl.appendChild(btn);
      buttons.push({ el: btn, art, column, cell: row });
    }
  }

  function renderTheme() {
    const theme = forcedTheme || state.display?.theme || 'clasico';
    if (theme === shownTheme) return;
    shownTheme = theme;
    const hasArt = theme !== 'clasico' && window.GridArt?.THEMES.includes(theme);
    document.body.classList.toggle('art', Boolean(hasArt));
    for (const { art, column, cell } of buttons) {
      art.innerHTML = hasArt ? GridArt.svg(theme, column, cell) : '';
    }
  }

  // Reconecta solo si se cae la Wi-Fi o se reinicia el servidor.
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const socket = new WebSocket(`${proto}://${location.host}/ws`);
    ws = socket;
    socket.addEventListener('open', () => { connected = true; render(); });
    socket.addEventListener('close', () => {
      connected = false;
      render();
      setTimeout(connect, 2000);
    });
    socket.addEventListener('message', (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'state') {
        state = msg.state;
        if (myVote && myVote.round !== state.vote.round) myVote = null;
        render();
      }
    });
  }

  function render() {
    renderTheme();
    for (const { el, column, cell } of buttons) {
      const cooling = column === 'fx' && state.fx.cooling[cell];
      el.disabled = Boolean(state.locks[column] || cooling);
      el.classList.toggle('pending', column === 'fx' && state.fx.pending.includes(cell));
      el.classList.toggle('voted', column === 'vote' && myVote?.cell === cell);
    }

    if (!connected) statusEl.textContent = 'reconectando…';
    else if (!state.bar) statusEl.textContent = 'conectado · esperando compás';
    else statusEl.textContent = `conectado · compás ${state.bar}`;

    if (state.locks.vote || !state.vote.barsLeft) voteEl.textContent = '';
    else {
      const left = state.vote.barsLeft;
      const mine = myVote ? ` · tu voto: ${myVote.cell}` : '';
      voteEl.textContent = `voto: ${left === 1 ? 'último compás' : `quedan ${left} compases`}${mine}`;
    }
  }

  function sendTouch(column, cell, el) {
    if (!ws || ws.readyState !== WebSocket.OPEN || state.locks[column]) return;
    if (column === 'fx' && state.fx.cooling[cell]) return;
    ws.send(JSON.stringify({ type: 'touch', column, cell, deviceId }));
    el.classList.add('tap');
    setTimeout(() => el.classList.remove('tap'), 140);
    if (column === 'vote') {
      myVote = { round: state.vote.round, cell };
      render();
    }
  }

  render();
  connect();
</script>
</body>
</html>
